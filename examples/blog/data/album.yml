# 上游 `layout/includes/page/album.pug` / `album_detail.pug` 的数据源
# （`site.data.album`，顶层数组）。`type: 1` 走瀑布流短文，`type: 2` 走 fj-gallery。
- class_name: 演示相册
  description: 瀑布流模式的相册
  cover: /img/default_cover.jpg
  path_name: /album/demo/
  type: 1
  top_background: /img/default_cover.jpg
  top_link: /about/
  top_btn_text: 关于我
  album_list:
    - content: 第一张照片的记忆
      date: 2025-04-20 10:00:00
      image:
        - /img/default_cover.jpg
      address: 上海
      from: 基准站
    - content: 第二张照片的记忆
      date: 2025-04-21 11:30:00
      image:
        - /img/default_cover.jpg
        - /img/512.png
      link: /archives/
- class_name: 图库相册
  description: 画廊模式的相册
  cover: /img/default_cover.jpg
  path_name: /album/gallery/
  type: 2
  top_background: /img/default_cover.jpg
  rowHeight: 220
  limit: 10
  lazyload: true
  btnLazyload: false
  album_list:
    - content: 画廊第一组
      address: 杭州
      image:
        - /img/default_cover.jpg
        - /img/512.png
