name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不写 with.version：pnpm/action-setup@v4 会读根 package.json 的
      # packageManager（pnpm@10.29.3）。version 与 packageManager 不一致时，
      # action 源码直接抛 "Multiple versions of pnpm specified"。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blog
        run: pnpm --filter blog build

      - name: Verify CSS baseline
        run: pnpm verify

      # 69 个 --anzhiyu-* 变量逐值比对（P1-9 第二条验收）
      - name: Verify CSS variables
        run: pnpm compare-vars

      # 上游差异守卫：readmode 笔误不许被「顺手修好」、baseline 字节数不许漂、
      # 上游关键文件 SHA 固定、prismjs 守卫前提仍在（D9 的结论基础）
      - name: Guard upstream delta
        run: pnpm check:upstream-delta

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: examples/blog/dist
          if-no-files-found: error
