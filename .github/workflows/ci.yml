name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不写 with.version：pnpm/action-setup@v4 会读根 package.json 的
      # packageManager（pnpm@10.29.3）。version 与 packageManager 不一致时，
      # action 源码直接抛 "Multiple versions of pnpm specified"。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blog
        run: pnpm --filter blog build

      - name: Verify CSS baseline
        run: pnpm verify

      # 69 个 --anzhiyu-* 变量逐值比对（P1-9 第二条验收）
      - name: Verify CSS variables
        run: pnpm compare-vars

      # 上游差异守卫：readmode 笔误不许被「顺手修好」、baseline 字节数不许漂、
      # 上游关键文件 SHA 固定、prismjs 守卫前提仍在（D9 的结论基础）
      - name: Guard upstream delta
        run: pnpm check:upstream-delta

      # CI 上没有 gitignore 的 .baseline-work/，baseline HTML 以归档形式进仓库
      # （tests/baseline-html/baseline-html.tar.gz，48 页 / 477 KB）。解压出来的
      # .baseline-html/ 就是 diff-html 的 baseline 根目录（约定见 P-baseline-html-ci）。
      - name: Extract baseline HTML
        run: node scripts/extract-baseline-html.mjs

      # Phase 2 已退出（2026-11-24）：48 页全 PASS / 0 差异，此步改为硬门禁——
      # 任何结构 / 文本 / 属性差异直接 exit 1。归一化豁免口径见 docs/upstream-delta.md
      # （N15–N24）与 docs/resource-path-policy.md；BASELINE_HTML_DIR 不能省：
      # diff-html 默认找 .baseline-work/public，CI 上不存在。
      - name: Diff HTML structure against upstream baseline
        env:
          BASELINE_HTML_DIR: .baseline-html
        run: node scripts/diff-html.mjs --all --json > diff-report.json

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            examples/blog/dist
            diff-report.json
          if-no-files-found: error
