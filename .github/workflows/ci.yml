name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不写 with.version：pnpm/action-setup@v4 会读根 package.json 的
      # packageManager（pnpm@10.29.3）。version 与 packageManager 不一致时，
      # action 源码直接抛 "Multiple versions of pnpm specified"。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blog
        run: pnpm --filter blog build

      - name: Verify CSS baseline
        run: pnpm verify

      # 69 个 --anzhiyu-* 变量逐值比对（P1-9 第二条验收）
      - name: Verify CSS variables
        run: pnpm compare-vars

      # 上游差异守卫：readmode 笔误不许被「顺手修好」、baseline 字节数不许漂、
      # 上游关键文件 SHA 固定、prismjs 守卫前提仍在（D9 的结论基础）
      - name: Guard upstream delta
        run: pnpm check:upstream-delta

      # CI 上没有 gitignore 的 .baseline-work/，baseline HTML 以归档形式进仓库
      # （tests/baseline-html/baseline-html.tar.gz，48 页 / 477 KB）。解压出来的
      # .baseline-html/ 就是 diff-html 的 baseline 根目录（约定见 P-baseline-html-ci）。
      - name: Extract baseline HTML
        run: node scripts/extract-baseline-html.mjs

      # Phase 2 已退出（2026-11-24）：48 页全 PASS / 0 差异，此步改为硬门禁——
      # 任何结构 / 文本 / 属性差异直接 exit 1。归一化豁免口径见 docs/upstream-delta.md
      # （N15–N24）与 docs/resource-path-policy.md；BASELINE_HTML_DIR 不能省：
      # diff-html 默认找 .baseline-work/public，CI 上不存在。
      - name: Diff HTML structure against upstream baseline
        env:
          BASELINE_HTML_DIR: .baseline-html
        run: node scripts/diff-html.mjs --all --json > diff-report.json

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            examples/blog/dist
            diff-report.json
          if-no-files-found: error

  # Phase 4 行为验收（P4-10）：tests/e2e 的行为基线 + 站内无刷新导航 / 12 种
  # page.type 冒烟 / 搜索 UI 检测。本机 Playwright 被 DSH Windows 沙箱阻断
  # （spawn EPERM + Chromium mojo 0x5，见 docs/PLAN.md 风险 R12），浏览器级验证
  # 只能在 Ubuntu runner 上真跑，这也是「放 CI 不放本地」的原因。
  # 站点由 playwright.config.ts 的 webServer 自己 build + preview，所以这里不重复构建；
  # 与 build job 并行：两者互不依赖，e2e 自己会产出 dist 的临时副本。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 build job 一样不写 with.version：pnpm/action-setup@v4 读根 package.json 的
      # packageManager（pnpm@10.29.3），写死 version 会报 "Multiple versions of pnpm specified"。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @playwright/test 是根 devDependency，npx 走本地 node_modules，不联网拉包
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npx playwright test

      # P7-1 PWA 离线验收：独立配置用 ANZHIYU_PWA=1 重建站点（默认构建不产出
      # sw.js/manifest），端口 4322、报告与结果目录独立，不和上面默认 e2e 抢 artifact。
      # 用例本身会等 SW ready → context.setOffline(true) → reload 断言首页仍可见。
      - name: Run Playwright PWA offline e2e
        run: npx playwright test -c playwright.pwa.config.ts

      # 首次真实执行结果由 Lead 回填到 docs/notes/P4-10-e2e-ci.md
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Upload Playwright PWA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pwa-report
          path: |
            playwright-pwa-report
            test-results-pwa
          if-no-files-found: ignore

  # Phase 7 · P7-2 性能预算（迁移站 Lighthouse 四项分数 + 资源预算），口径与预算依据
  # 见 docs/notes/P7-2-perf.md。独立 job，不动上面的 build / e2e。
  #
  # 为什么必须在 CI：
  #   本机 Playwright/Chromium 起不来（DSH Windows 沙箱阻断，PLAN 风险 R12），浏览器
  #   测量只能在 ubuntu runner 真跑，这是唯一能拿到 Lighthouse 真实分数的地方。
  #
  # 测什么：examples/blog（与迁移站同主题、同 CSS/JS 的验证站）。真实站 94 页需要
  #   Hexo 源站内容与私有配置，CI 构建不出来；验证站是「同一份产物」的性能代理，
  #   口径差异见 docs/notes/P7-2-perf.md §1。
  #
  # 第三方 CDN：首页引用 8 个外部 host（cdn.cbd.int / npm.elemecdn.com / bu.dusays.com /
  #   img02.anheyu.com / yuanshen.site / sdk.51.la …），CI 网络不可控会造成跨次抖动，
  #   所以 .lighthouserc.json 用 blockedUrlPatterns 逐条拦掉。分数口径因此是
  #   「自有资源性能」，不是含第三方 CDN 的完整现场分数（见文档 §2/§3）。
  #
  # 门槛：categories 四项 + 资源预算（total-byte-weight / script / stylesheet /
  #   third-party），全部 error 级硬门禁；不达标先优化，禁止靠调低阈值掩盖（§7）。
  #   分数门禁演进：task-12 的占位初值（a11y 0.80 / seo 0.85）被 CI 首跑实测
  #   （run 45395473424：a11y 0.77/0.76、seo 0.83）证伪，task-16 按「实测基线 - 0.01」
  #   校准为 a11y 0.75 / seo 0.82；performance 0.60 / best-practices 0.80 首跑通过保持不变。
  #   演进表 / 证据 / 回填模板见 docs/notes/P7-2-perf.md §4.1、§6、§9。
  #   a11y、seo 的真实水平受上游主题 DOM 限制，提升它们是 Phase 7 后续 backlog，
  #   不是本次迁移的退出条件（同文档 §9.2）。
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 build / e2e 一致：不写 with.version，pnpm/action-setup@v4 读根 package.json 的
      # packageManager（pnpm@10.29.3），写死 version 会报 "Multiple versions of pnpm specified"。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与 build job 同一条构建命令；默认构建不产出 sw.js/manifest（PWA 只在
      # ANZHIYU_PWA=1 时接线），所以这里测到的就是基线 62 页产物。
      - name: Build blog
        run: pnpm --filter blog build

      # 必须 `pnpm exec`：`pnpm --filter blog preview -- --host ...` 会把 `--` 原样传给
      # astro preview，本机实测报 `Unknown command: astro preview --host`。
      # 后台起在 127.0.0.1:4321（.lighthouserc.json 的三个 URL 都指向它），轮询到
      # HTTP 200 再往下走——直接 sleep 不可靠，CI 冷启动有快有慢。
      # 轮询用 `curl -fs`（-s 静默 + -f HTTP 非 2xx 即失败）：首轮探测连不上是正常的
      # 冷启动状态，不该在成功 run 的日志里留 `curl: (7) Failed to connect` 噪音
      # （run 45395473424 的 `curl: (7)` 就是 `-S` 把首轮失败打出来的）；只有 60s 真超时
      # 才输出 `::error::` + 服务端日志并 exit 1。
      - name: Start preview server
        run: |
          set -euo pipefail
          PREVIEW_LOG="$RUNNER_TEMP/anzhiyu-preview.log"
          pnpm --filter blog exec astro preview --host 127.0.0.1 --port 4321 > "$PREVIEW_LOG" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null "http://127.0.0.1:4321/"; then
              echo "preview ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::astro preview 未在 60s 内就绪（http://127.0.0.1:4321/）"
          cat "$PREVIEW_LOG"
          exit 1

      # 固定版本 npx 安装：不改 root package.json / pnpm-lock.yaml（npx 只在 runner
      # 的 npx 缓存里装），也不影响现有依赖树。0.16.1 是本任务时 @lhci/cli 的 npm
      # dist-tag latest（内置 lighthouse 13.6.0）。
      # Chrome 用 ubuntu-latest 预装的 google-chrome，不设 CHROME_PATH，交给
      # chrome-launcher 自动发现；换 runner 镜像时要先确认有 Chrome，见文档 §5 排障。
      #
      # 落盘语义（run 45395473424 的 artifact 为空就是这个坑）：
      #   - `lhci collect` 通过 @lhci/utils/src/saved-reports.js 把 lhr-*.json / lhr-*.html
      #     写到 `<cwd>/.lighthouseci/`；`lhci assert` 失败前也会把 assertion-results.json
      #     写进同一目录——即 lhci 本身**是**落盘的，不是「没配置 upload 所以没文件」。
      #   - 真正丢文件的是 upload-artifact@v4：v4.4+ 默认排除 hidden 文件（`include-hidden-files:
      #     false`），`.lighthouseci` 是点目录，于是 glob 一个都匹配不到，日志报
      #     "No files were found with the provided path: .lighthouseci"。
      #   - 修法两层：① .lighthouserc.json 的 `ci.upload` 配 filesystem target（autorun 只有
      #     在 rc 有 upload 段时才执行 upload，产出 manifest.json + 可读名报告）；
      #     ② 下面的 Upload 步骤显式 `include-hidden-files: true`（根因修复，少了它
      #     连 lhr-*.json 也传不上去）。
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.16.1 autorun

      # 失败也要留证据：.lighthouseci 里是逐次 lhr-*.json（categories / audits /
      # resource-summary 原始数值）、assertion-results.json（逐条断言的 actual/expected）、
      # filesystem target 产出的 manifest.json + 可读名报告，preview.log 是服务端日志。
      # 先 mkdir -p：collect 阶段就挂掉时该目录可能不存在，artifact 步骤不能因此报错。
      # 最后把清单打进日志：将来 artifact 再空，日志里能直接分清「没落盘」还是「没上传」。
      - name: Collect Lighthouse artifacts
        if: always()
        run: |
          mkdir -p .lighthouseci
          if [ -f "$RUNNER_TEMP/anzhiyu-preview.log" ]; then
            cp "$RUNNER_TEMP/anzhiyu-preview.log" .lighthouseci/preview.log
          fi
          echo "== .lighthouseci inventory =="
          ls -la .lighthouseci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          # 根因修复：.lighthouseci 是隐藏目录，upload-artifact@v4.4+ 默认不传 hidden 文件。
          # 置为 error：连 preview.log（也在这个隐藏目录里）都传不上去时让 CI 直接红，
          # 避免「门禁绿了但 artifact 空」的静默回归。
          include-hidden-files: true
          if-no-files-found: error
