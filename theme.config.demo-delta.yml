# theme.config.demo-delta.yml — 功能全开演示配置 delta（2026-11-25）
#
# 用途：本地/线上演示主题全部功能，与 SHA 守卫的 theme.config.yml（上游
# 1.7.1 冻结基线，diff 硬门禁参照）并存互不影响。使用方法：
#   scripts/deploy-demo-pages.mjs 构建时把下方 delta 深合并到 theme.config.yml
#   （对象递归、数组整体替换，与 loader 合并语义一致），生成临时完整配置并经
#   ANZHIYU_THEME_CONFIG 指向（HTML 与 CSS 两条通道收口同一文件，B5 不变）；
#   同时 data/essay.yml 第一组临时补 `home_essay: true`（构建后恢复）、
#   生成搜索索引 search.xml（格式见 local-search.js 的 <entry> 解析：
#   title/url/content/tags，部署子路径时 url 需带前缀，如 /blog/2024/11/20/24531/）。
#
# 与基线配置的差异（功能开关）：即下方 delta——
#   menu: 顶层菜单 4 组（文章/短文/友链/我的，链到 fixtures 页面型内容）
#   local_search.enable: true（+ search.xml 索引）
#   rightClickMenu.enable: true
#   shortcutKey.enable: true（#keyboard-tips 11 条键位）
#   greetingBox.enable: true + list 时段问候（#greetingBox）
#   busuanzi.site_uv/site_pv/page_pv: true（访问计数）
#   mainTone.enable: true + mode: colorthief（前端取主色，A2 的 color-thief 脚本）
#   home_top.swiper.enable: true（首页轮播卡）
#   bubble.enable: true（卡片气泡动效）
#   data/essay.yml 首组 home_essay: true（A6 #bbTimeList，脚本临时注入）
#
# 未开：评论系统（需 Twikoo/Waline 等后端）、comment_barrage（依赖 Twikoo）、
# friends_vue（需朋友圈后端 apiurl）、agreementPopup（演示免打扰）。

menu:
  文章:
    隧道: /archives/ || anzhiyu-icon-box-archive
    分类: /categories/ || anzhiyu-icon-shapes
    标签: /tags/ || anzhiyu-icon-tags
  短文:
    闲言碎碎: /essay/ || anzhiyu-icon-lightbulb
  友链:
    友人帐: /link/ || anzhiyu-icon-link
    朋友圈: /fcircle/ || anzhiyu-icon-artstation
  我的:
    音乐馆: /music/ || anzhiyu-icon-music
    关于: /about/

local_search:
  enable: true

rightClickMenu:
  enable: true

shortcutKey:
  enable: true

greetingBox:
  enable: true
  list:
    - greeting: 晚安😴
      startTime: 0
      endTime: 5
    - greeting: 早上好鸭👋, 祝你一天好心情！
      startTime: 6
      endTime: 9
    - greeting: 上午好👋, 状态很好，鼓励一下～
      startTime: 10
      endTime: 10
    - greeting: 11点多啦, 在坚持一下就吃饭啦～
      startTime: 11
      endTime: 11
    - greeting: 午安👋, 宝贝
      startTime: 12
      endTime: 14
    - greeting: 🌈充实的一天辛苦啦！
      startTime: 14
      endTime: 18
    - greeting: 19点喽, 奖励一顿丰盛的大餐吧🍔。
      startTime: 19
      endTime: 19
    - greeting: 晚上好👋, 在属于自己的时间好好放松😌~
      startTime: 20
      endTime: 24

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

mainTone:
  enable: true
  mode: colorthief

# 首页顶部（标题 / 轮播 / 分类按钮 / 推广卡对齐 demo 内容与本仓库）
home_top:
  swiper:
    enable: true
  title: AnZhiYu × Astro
  subTitle: hexo-theme-anzhiyu 的 Astro 移植版
  siteText: anzhiyu.example.mcxiaochen.top
  category:
    - name: 样式演示
      path: /categories/样式演示/
      shadow: var(--anzhiyu-shadow-blue)
      class: blue
      icon: anzhiyu-icon-dove
    - name: 标签演示
      path: /categories/标签演示/
      shadow: var(--anzhiyu-shadow-red)
      class: red
      icon: anzhiyu-icon-fire
    - name: 入门指南
      path: /categories/入门指南/
      shadow: var(--anzhiyu-shadow-green)
      class: green
      icon: anzhiyu-icon-book
  banner:
    tips: 开源模板
    title: Use this template
    image: /img/demo/anime/banner.jpg
    link: https://github.com/mcxiaochenn/astro-theme-anzhiyu

bubble:
  enable: true

# —— 观感（B3，2026-11-27）：头像 / 横幅 / 封面 / 社交 / 页脚 ——
# 素材在 public/img/demo/（老站 xcAnzhiyu 素材本地化 + 泰山行记摄影）。
# 站名身份（title/subtitle/description/author）不走本文件：由
# scripts/deploy-demo-pages.mjs 以 DEPLOY_SITE_* 环境变量注入 src/data/site-identity.ts。

# C1（2026-11-27 第二批）：首页非全屏（上游缺省 100vh）
index_top_img_height: 42vh

avatar:
  img: /img/demo/anime/avatar-anime.jpg
  effect: true

# 首页横幅（泰山日出）；各页顶部图由页面 frontmatter 的 top_img 提供
index_img: "background: url(/img/demo/anime/banner.jpg) top / cover no-repeat"
default_top_img: /img/demo/anime/anime-13-tall.jpg

error_404:
  background: /img/demo/anime/anime-14-tall.jpg

cover:
  default_cover:
    - /img/default_cover.jpg

author_status:
  enable: true
  statusImg: /img/demo/anime/avatar-anime.jpg
  skills:
    - 🤖️ 数码科技爱好者
    - 🔍 分享与热心帮助
    - 🏠 智能家居小能手
    - 🔨 设计开发一条龙

social:
  GitHub: https://github.com/mcxiaochenn || anzhiyu-icon-github

footer:
  owner:
    enable: true
    since: 2025
  custom_text: 未完待续……
  runtime:
    enable: true
    launch_time: 07/17/2025 00:00:00
  bdageitem:
    enable: true
    list:
      - link: https://astro.build/
        shields: https://img.shields.io/badge/Astro-7.x-FF5D01?style=flat&logo=astro&logoColor=white
        message: 博客框架为 Astro 7
      - link: https://github.com/mcxiaochenn/astro-theme-anzhiyu
        shields: https://img.shields.io/badge/Theme-AnZhiYu%20Astro-2E67D3?style=flat
        message: 本站使用 AnZhiYu 主题的 Astro 移植版
  # 主题链接指向本仓库（上游默认指 hexo-theme-anzhiyu，demo 不给原主题引流）
  linkList:
    - link: https://github.com/mcxiaochenn/astro-theme-anzhiyu
      text: 主题

# 侧栏「建站天数」与 footer 运行时间同源（上游默认 4/1/2021 是占位）
runtimeshow:
  enable: true
  publish_date: 07/17/2025 00:00:00

# —— C1：引流清理与布局对齐（2026-11-27 第二批）——

# 网站导航面板（上游默认链 anheyu.com 作者站，换为本项目与演示站）
nav:
  enable: true
  menu:
    - title: 网页
      item:
        - name: 演示站
          link: https://anzhiyu.example.mcxiaochen.top/
          icon: /img/favicon.ico
    - title: 项目
      item:
        - name: AnZhiYu Astro（本仓库）
          link: https://github.com/mcxiaochenn/astro-theme-anzhiyu
          icon: /img/favicon.ico
        - name: 上游 hexo-theme-anzhiyu
          link: https://github.com/anzhiyu-dev/hexo-theme-anzhiyu
          icon: /img/favicon.ico

# 公众号推广卡（上游示例引流）关闭
aside:
  card_weixin:
    enable: false

# colorthief：cbd 快照缺 .umd.min.js（404），覆盖为存在的 .umd.js（mainTone 取色依赖）
CDN:
  option:
    colorthief: https://cdn.cbd.int/colorthief@2.6.0/dist/color-thief.umd.js

# 文章版权卡位置（上游默认「长沙」是作者示例数据）
post_copyright:
  location: 互联网
